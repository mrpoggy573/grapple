<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>grapple</title>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #05070c;
  color: #aaa;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  width: 100vw;
  height: 100vh;
}

#menu {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #080808;
}

#menuBox {
  width: min(340px, calc(100vw - 30px));
  padding: 24px;
  text-align: center;
}

h1 {
  margin: 0 0 8px;
  font-size: 42px;
  font-weight: normal;
  color: #ccc;
}

p {
  color: #888;
}

input, select, button {
  font: inherit;
  background: #191919;
  color: #bbb;
  border: 1px solid #444;
  border-radius: 2px;
}

input {
  padding: 9px;
  margin: 12px 0 8px;
}

button {
  padding: 6px 9px;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: default;
}

#name {
  width: 100%;
}

#play {
  width: 100%;
  margin-top: 5px;
  padding: 9px;
  background: #333;
  color: #ddd;
}

#hud {
  display: none;
  position: fixed;
  left: 14px;
  top: 14px;
  z-index: 2;
  pointer-events: none;
  color: #bbb;
  line-height: 1.5;
  font-size: 14px;
}

#leaderboard {
  position: fixed;
  top: 14px;
  right: 14px;
  z-index: 3;
  width: 180px;
  pointer-events: none;
}

.panelTitle {
  font-weight: normal;
  color: #999;
  margin-bottom: 5px;
}

.leaderRow {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
  padding: 2px 0;
  color: #aaa;
}

.leaderRow span:first-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#shop {
  display: none;
  position: fixed;
  right: 14px;
  top: 155px;
  z-index: 3;
  width: 180px;
  color: #aaa;
  font-size: 12px;
  line-height: 1.9;
}

#shop button {
  font-size: 12px;
}

#customize {
  display: none;
  position: fixed;
  right: 14px;
  top: 225px;
  z-index: 3;
  width: 180px;
  color: #aaa;
  font-size: 12px;
  line-height: 2.2;
}

#customize label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

#playerColor {
  width: 34px;
  height: 23px;
  padding: 0;
  margin: 0;
}

#playerPattern {
  max-width: 125px;
  padding: 3px;
  font-size: 12px;
}

#restart {
  display: none;
  position: fixed;
  right: 14px;
  bottom: 14px;
  z-index: 5;
  color: #bbb;
  padding: 8px 12px;
}

#toast {
  position: fixed;
  left: 50%;
  top: 20px;
  transform: translateX(-50%);
  z-index: 20;
  padding: 7px 10px;
  display: none;
  background: #111;
  color: #ccc;
  font-size: 13px;
}

#help {
  position: fixed;
  left: 14px;
  bottom: 14px;
  z-index: 2;
  color: #888;
  font-size: 12px;
  pointer-events: none;
  line-height: 1.5;
}

@media (max-width: 600px) {
  #leaderboard {
    width: 145px;
    right: 8px;
    top: 8px;
  }

  #shop {
    right: 8px;
    top: 150px;
    width: 145px;
  }

  #customize {
    right: 8px;
    top: 215px;
    width: 145px;
  }

  #hud {
    left: 8px;
    top: 8px;
    font-size: 13px;
  }

  #help {
    left: 8px;
    bottom: 8px;
    max-width: 145px;
  }
}
</style>
</head>

<body>
<canvas id="game"></canvas>

<div id="menu">
  <div id="menuBox">
    <h1>grapple</h1>
    <p>Climb up. Reach the Moon.</p>
    <input id="name" maxlength="16" placeholder="Your name" value="Player" autocomplete="off">
    <button id="play">PLAY</button>
    <p id="status" style="font-size:12px;margin-bottom:0">Connecting to server...</p>
  </div>
</div>

<div id="hud">
  <div id="height">HEIGHT: 0m</div>
  <div id="reds">REDS: 10</div>
  <div id="hops">WALL HOPS: 5/5</div>
</div>

<div id="leaderboard">
  <div class="panelTitle">LEADERBOARD</div>
  <div id="leaderRows">Waiting for players...</div>
</div>

<div id="shop">
  <div>SHOP</div>
  <div id="grappleLength">GRAPPLE LENGTH: 1x</div>
  <div id="shopReds">10 Reds</div>
  <button id="grappleUpgrade">Upgrade Grapple</button>
</div>

<div id="customize">
  <div>YOUR CIRCLE</div>
  <label>
    Color
    <input id="playerColor" type="color" value="#00ff66">
  </label>
  <label>
    Pattern
    <select id="playerPattern">
      <option value="Solid">Solid</option>
      <option value="Horizontal">Lines</option>
      <option value="Diagonal">Diagonal</option>
      <option value="Hexagon">Hexagon</option>
    </select>
  </label>
</div>

<div id="help">
  A / D or ← / → to move<br>
  W / Space to jump<br>
  Hold mouse to grapple
</div>

<button id="restart">RESTART</button>
<div id="toast"></div>

<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const menu = document.getElementById("menu");
  const status = document.getElementById("status");
  const hud = document.getElementById("hud");
  const shop = document.getElementById("shop");
  const restartButton = document.getElementById("restart");

  const socket = io("https://grapple-qqcp.onrender.com", {
    transports: ["websocket", "polling"]
  });

  let myId = null;
  let joined = false;

  let world = {
    width: 1000,
    height: 30000,
    moon: {
      x: 500,
      y: 1500,
      radius: 500
    }
  };

  let grapplePoints = [];
  let players = [];
  let bots = [];

  let mouse = {
    x: 0,
    y: 0,
    down: false
  };

  let keys = {};
  let localPlayer = null;

  let cameraX = 0;
  let cameraY = 0;

  let snapshotTime = 0;
  let toastTimer = null;

  let previousPositions = new Map();
  let lastLeaderboardSignature = "";
  let lastHudSignature = "";

  const colorInput = document.getElementById("playerColor");
  const patternInput = document.getElementById("playerPattern");
  const upgradeButton = document.getElementById("grappleUpgrade");

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  addEventListener("resize", resize);
  resize();

  socket.on("connect", () => {
    status.textContent = "Ready to play";
    document.getElementById("play").disabled = false;
  });

  socket.on("disconnect", () => {
    status.textContent = "Disconnected. Reconnecting...";

    if (!joined) {
      document.getElementById("play").disabled = true;
    }
  });

  socket.on("connect_error", () => {
    if (!joined) {
      status.textContent = "Connecting to server...";
    }
  });

  socket.on("init", data => {
    myId = data.id;
    world = data.world;
    grapplePoints = data.grapplePoints;
    players = data.players;
    bots = data.bots;

    previousPositions = new Map(
      players.map(p => [
        p.id,
        { x: p.x, y: p.y }
      ])
    );

    joined = true;

    menu.style.display = "none";
    hud.style.display = "block";
    shop.style.display = "block";
    document.getElementById("customize").style.display = "block";

    snapshotTime = performance.now();

    updateAppearance();
  });

  socket.on("playerJoined", p => {
    if (!players.some(player => player.id === p.id)) {
      players.push(p);
    }
  });

  socket.on("playerLeft", id => {
    players = players.filter(p => p.id !== id);
    previousPositions.delete(id);
  });

  socket.on("state", state => {
    const now = performance.now();

    previousPositions = new Map(
      players.map(p => [
        p.id,
        { x: p.x, y: p.y }
      ])
    );

    players = state.players;
    bots = state.bots;
    world = state.world;

    snapshotTime = now;
  });

  socket.on("botTaken", id => {
    bots = bots.filter(bot => bot.id !== id);
  });

  socket.on("notice", message => {
    showToast(message);
  });

  document.getElementById("play").addEventListener("click", () => {
    if (!socket.connected) {
      status.textContent = "Server not connected.";
      return;
    }

    document.getElementById("play").disabled = true;

    socket.emit("join", {
      name: document.getElementById("name").value || "Player"
    });
  });

  function updateAppearance() {
    if (!joined) {
      return;
    }

    socket.emit("setAppearance", {
      color: colorInput.value,
      pattern: patternInput.value
    });
  }

  colorInput.addEventListener("input", updateAppearance);
  patternInput.addEventListener("change", updateAppearance);

  upgradeButton.addEventListener("click", () => {
    if (joined) {
      socket.emit("buyGrappleUpgrade");
    }
  });

  function showToast(message) {
    const toast = document.getElementById("toast");

    toast.textContent = message;
    toast.style.display = "block";

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
      toast.style.display = "none";
    }, 1800);
  }

  function getMe() {
    return players.find(p => p.id === myId) || null;
  }

  function sendInput() {
    if (!joined || !localPlayer) {
      return;
    }

    socket.emit("input", {
      left: !!(keys.ArrowLeft || keys.KeyA),
      right: !!(keys.ArrowRight || keys.KeyD),
      jump: !!(keys.Space || keys.KeyW || keys.ArrowUp),
      mouseDown: mouse.down,
      aimX: mouse.x + cameraX,
      aimY: mouse.y + cameraY
    });
  }

  addEventListener("keydown", e => {
    if (
      ["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"]
        .includes(e.code)
    ) {
      e.preventDefault();
    }

    keys[e.code] = true;

    if (e.code === "Escape") {
      mouse.down = false;
    }
  }, { passive: false });

  addEventListener("keyup", e => {
    keys[e.code] = false;
  });

  canvas.addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
  });

  canvas.addEventListener("mousedown", e => {
    if (e.button === 0) {
      mouse.down = true;
    }
  });

  addEventListener("mouseup", e => {
    if (e.button === 0) {
      mouse.down = false;
    }
  });

  addEventListener("blur", () => {
    keys = {};
    mouse.down = false;
  });

  restartButton.addEventListener("click", () => {
    if (joined) {
      socket.emit("restart");
    }
  });

  function drawCircle(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawPatternCircle(x, y, r, color, pattern) {
    ctx.save();

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.clip();

    ctx.strokeStyle = "rgba(255,255,255,0.82)";
    ctx.lineWidth = 1.5;

    if (pattern === "Horizontal" || pattern === "Diagonal") {
      for (let offset = -r * 2; offset <= r * 2; offset += 7) {
        ctx.beginPath();

        if (pattern === "Horizontal") {
          ctx.moveTo(x - r, y + offset);
          ctx.lineTo(x + r, y + offset);
        } else {
          ctx.moveTo(x - r, y + offset);
          ctx.lineTo(x + r, y + offset + r * 2);
        }

        ctx.stroke();
      }
    } else if (pattern === "Hexagon") {
      const size = 5;
      const stepX = size * 1.75;
      const stepY = size * 1.5;

      for (let row = -r; row <= r; row += stepY) {
        for (let col = -r; col <= r; col += stepX) {
          const hx =
            x + col +
            (Math.round(row / stepY) % 2) * size * 0.875;

          const hy = y + row;

          ctx.beginPath();

          for (let i = 0; i < 6; i++) {
            const angle = Math.PI / 3 * i;
            const px = hx + Math.cos(angle) * size;
            const py = hy + Math.sin(angle) * size;

            if (i === 0) {
              ctx.moveTo(px, py);
            } else {
              ctx.lineTo(px, py);
            }
          }

          ctx.closePath();
          ctx.stroke();
        }
      }
    }

    ctx.restore();

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,255,255,0.45)";
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function getRenderedPosition(p, now) {
    const previous = previousPositions.get(p.id);

    if (!previous) {
      return { x: p.x, y: p.y };
    }

    const alpha = Math.max(
      0,
      Math.min(1, (now - snapshotTime) / 33.333)
    );

    return {
      x: previous.x + (p.x - previous.x) * alpha,
      y: previous.y + (p.y - previous.y) * alpha
    };
  }

  function draw() {
    const w = innerWidth;
    const h = innerHeight;
    const frameTime = performance.now();

    ctx.clearRect(0, 0, w, h);

    localPlayer = getMe();

    const localRenderPosition = localPlayer
      ? getRenderedPosition(localPlayer, frameTime)
      : null;

    if (localPlayer) {
      cameraX = localRenderPosition.x - w / 2;
      cameraY = localRenderPosition.y - h / 2;

      cameraX = Math.max(
        -w / 2 + world.width / 2,
        Math.min(world.width - w / 2, cameraX)
      );

      restartButton.style.display = localPlayer.floating
        ? "block"
        : "none";

      const hudSignature =
        `${localPlayer.height}|${localPlayer.reds}|${localPlayer.wallHops}`;

      if (hudSignature !== lastHudSignature) {
        document.getElementById("height").textContent =
          "HEIGHT: " + localPlayer.height + "m";

        document.getElementById("reds").textContent =
          "REDS: " + localPlayer.reds;

        document.getElementById("hops").textContent =
          "WALL HOPS: " + localPlayer.wallHops + "/5";

        document.getElementById("shopReds").textContent =
          localPlayer.reds + " Reds";

        lastHudSignature = hudSignature;
      }

      document.getElementById("grappleLength").textContent =
        "GRAPPLE LENGTH: " + localPlayer.grappleMultiplier + "x";

      upgradeButton.textContent =
        localPlayer.grappleUpgradeCost === null
          ? "MAXIMUM REACHED"
          : "Upgrade (" + localPlayer.grappleUpgradeCost + " Reds)";

      upgradeButton.disabled =
        localPlayer.grappleUpgradeCost === null;
    } else {
      cameraX = 0;
      cameraY = world.height - h;
    }

    const altitude = localPlayer
      ? Math.max(0, (world.height - localPlayer.y) / world.height)
      : 0;

    const sky = ctx.createLinearGradient(0, 0, 0, h);
    const blue = Math.max(0, 190 * (1 - altitude * 2.5));

    sky.addColorStop(
      0,
      `rgb(${Math.floor(blue * 0.55)},${Math.floor(blue * 0.82)},${Math.floor(blue)})`
    );

    sky.addColorStop(1, "#03050a");

    ctx.fillStyle = localPlayer && localPlayer.floating
      ? "#070716"
      : sky;

    ctx.fillRect(0, 0, w, h);

    ctx.save();
    ctx.translate(-cameraX, -cameraY);

    ctx.fillStyle = "#111722";
    ctx.fillRect(-1500, 0, 1500, world.height + 2000);
    ctx.fillRect(world.width, 0, 1500, world.height + 2000);

    ctx.fillStyle = "#222936";
    ctx.fillRect(
      -1000,
      world.height,
      world.width + 2000,
      1000
    );

    grapplePoints.forEach(point => {
      const sx = point.x - cameraX;
      const sy = point.y - cameraY;

      if (
        sx < -50 ||
        sx > w + 50 ||
        sy < -50 ||
        sy > h + 50
      ) {
        return;
      }

      drawCircle(
        point.x,
        point.y,
        point.radius,
        "#ff6500"
      );

      if (Math.hypot(mouse.x - sx, mouse.y - sy) < 150) {
        ctx.strokeStyle = "#aaa";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.arc(
          point.x,
          point.y,
          point.radius + 6,
          0,
          Math.PI * 2
        );
        ctx.stroke();
      }
    });

    bots.forEach(bot => {
      const sx = bot.x - cameraX;
      const sy = bot.y - cameraY;

      if (
        sx < -40 ||
        sx > w + 40 ||
        sy < -40 ||
        sy > h + 40
      ) {
        return;
      }

      drawCircle(bot.x, bot.y, 18, "#ff3030");

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 10px Arial";
      ctx.textAlign = "center";
      ctx.fillText("+10", bot.x, bot.y + 3);
    });

    drawCircle(
      world.moon.x,
      world.moon.y,
      world.moon.radius,
      "#e8edf5"
    );

    drawCircle(
      world.moon.x - 130,
      world.moon.y - 80,
      65,
      "#cbd2df"
    );

    drawCircle(
      world.moon.x + 145,
      world.moon.y + 95,
      90,
      "#cbd2df"
    );

    drawCircle(
      world.moon.x + 35,
      world.moon.y - 190,
      45,
      "#cbd2df"
    );

    players.forEach(p => {
      const rendered = getRenderedPosition(p, frameTime);

      if (p.hook) {
        ctx.strokeStyle = p.id === myId ? "#bbb" : "#777";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(rendered.x, rendered.y);
        ctx.lineTo(p.hook.x, p.hook.y);
        ctx.stroke();
      }

      drawPatternCircle(
        rendered.x,
        rendered.y,
        p.size,
        p.color || "#00ff66",
        p.pattern || "Solid"
      );

      ctx.fillStyle = "#bbb";
      ctx.font = "12px Arial";
      ctx.textAlign = "center";
      ctx.fillText(
        p.name,
        rendered.x,
        rendered.y - 27
      );
    });

    ctx.restore();

    const sorted = [...players]
      .sort((a, b) => b.height - a.height)
      .slice(0, 7);

    const signature = sorted
      .map((p, i) => `${i + 1}:${p.id}:${p.name}:${p.height}`)
      .join("|");

    if (signature !== lastLeaderboardSignature) {
      const leaderRows = document.getElementById("leaderRows");

      if (!sorted.length) {
        leaderRows.textContent = "Waiting for players...";
      } else {
        const fragment = document.createDocumentFragment();

        sorted.forEach((p, i) => {
          const row = document.createElement("div");
          row.className = "leaderRow";

          const name = document.createElement("span");
          name.textContent =
            (i + 1) + ". " + p.name +
            (p.id === myId ? " (you)" : "");

          const height = document.createElement("span");
          height.textContent = p.height + "m";

          row.append(name, height);
          fragment.append(row);
        });

        leaderRows.replaceChildren(fragment);
      }

      lastLeaderboardSignature = signature;
    }

    requestAnimationFrame(draw);
  }

  setInterval(sendInput, 1000 / 30);

  draw();
})();
</script>
</body>
</html>
